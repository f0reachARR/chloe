[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
chloe-agent-proto = { path = "crates/chloe-agent-proto" }
chloe-policy = { path = "crates/chloe-policy" }

anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
postcard = { version = "1.1.3", features = ["use-std"] }
pty-process = { version = "0.5.3", features = ["async"] }
rama = { version = "0.4.0", features = ["http-full", "boring"] }
rustix = { version = "1.1.5", features = ["process", "termios"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
tokio-vsock = "0.7.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
