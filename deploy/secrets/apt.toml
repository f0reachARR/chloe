# 認証のある apt のリポジトリのパスワード。apt は環境変数を読まないので、プレースホルダーを
# auth.conf に書いて VM に置く。apt はそれを Basic 認証のパスワードとして送り、プロキシが本物に
# 差し替える。
# hosts とファイルの machine、login を自分のリポジトリに合わせ、value を本物のパスワードに書き換えて登録する。
#   ssh USER@HOST chloe secret set apt --spec < apt.toml
# sources.list ではリポジトリを https:// で書く (http:// だと、プロキシから先へ本物のパスワードが平文で流れる)。
value = "..."

[[inject]]
hosts = ["apt.example.com"]
header = "authorization"
format = "basic-password"

[[files]]
path = "/etc/apt/auth.conf.d/chloe-apt.conf"
content = "machine apt.example.com login deploy password {value}\n"
