# AWS access key. Tools in the VM sign with the placeholder key; the proxy re-signs with the real key.
# Replace each field's value and register it.
#   ssh USER@HOST chloe secret set aws --spec < aws.toml
[fields.access_key_id]
env = ["AWS_ACCESS_KEY_ID"]
placeholder = "AKIA{id}"
value = "AKIA..."

[fields.secret_access_key]
env = ["AWS_SECRET_ACCESS_KEY"]
value = "..."

# For temporary credentials, add the session token field too.
# [fields.session_token]
# env = ["AWS_SESSION_TOKEN"]
# value = "..."

[[sign]]
scheme = "aws-sigv4"
hosts = ["*.amazonaws.com"]
