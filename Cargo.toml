[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
chloe-agent-proto = { path = "crates/chloe-agent-proto" }
chloe-audit = { path = "crates/chloe-audit" }
chloe-controller = { path = "crates/chloe-controller" }
chloe-github = { path = "crates/chloe-github" }
chloe-mtls = { path = "crates/chloe-mtls" }
chloe-policy = { path = "crates/chloe-policy" }
chloe-secrets = { path = "crates/chloe-secrets" }

aes-gcm = { version = "0.11.1", features = ["getrandom"] }
anyhow = "1.0.104"
axum = "0.8"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
hmac = "0.12.1"
http-body-util = "0.1.5"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "service"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["use_pem", "rust_crypto"] }
postcard = { version = "1.1.3", features = ["use-std"] }
pty-process = { version = "0.5.3", features = ["async"] }
qrcode = { version = "0.14.1", default-features = false }
rama = { version = "0.4.0", features = ["http-full", "boring"] }
rand = "0.10.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "crypto", "pem", "x509-parser"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
russh = "0.64.1"
rustls = "0.23"
rustix = { version = "1.1.5", features = ["process", "termios"] }
schemars = "1.2.3"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3"
terminput = "0.5.15"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7.20", features = ["codec"] }
tokio-vsock = "0.7.2"
toml = "1.1.8"
tower-http = { version = "0.6.11", features = ["fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tui-input = "0.15.5"
utoipa = "6.0.0"
x509-parser = "0.18"
yamux = "0.14.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
