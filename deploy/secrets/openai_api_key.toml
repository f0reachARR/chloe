# OpenAI の API キー (Codex)。value を本物のキーに書き換えて登録する。
#   ssh USER@HOST chloe secret set openai_api_key --spec < openai_api_key.toml
value = "sk-proj-..."
# codex exec は CODEX_API_KEY を読む。
env = ["OPENAI_API_KEY", "CODEX_API_KEY"]
placeholder = "sk-proj-{id}"

[[inject]]
hosts = ["api.openai.com"]
header = "authorization"
