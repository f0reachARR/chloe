# Token for using Claude Code with a subscription (get it by running claude setup-token locally).
# Replace value with the real token and register it.
#   ssh USER@HOST chloe secret set claude_oauth_token --spec < claude_oauth_token.toml
value = "sk-ant-oat01-..."
env = ["CLAUDE_CODE_OAUTH_TOKEN"]
placeholder = "sk-ant-oat01-{id}"

[[inject]]
hosts = ["api.anthropic.com"]
header = "authorization"
