# Anthropic API key (Claude Code). Replace value with the real key and register it.
#   ssh USER@HOST chloe secret set anthropic_api_key --spec < anthropic_api_key.toml
value = "sk-ant-api03-..."
env = ["ANTHROPIC_API_KEY"]
placeholder = "sk-ant-api03-{id}"

[[inject]]
hosts = ["api.anthropic.com"]
header = "x-api-key"
