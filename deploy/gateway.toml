# Example gateway configuration (/etc/chloe/gateway.toml). Paths match the layout in docs/install.md.
#
#   sudo install -m 644 deploy/gateway.toml /etc/chloe/gateway.toml
#   sudo systemctl enable --now chloe-gateway
#
# Connect with ssh <github-login>@<host>, using a public key registered on GitHub.
# With a GitHub App configured, users without a registered public key can log in via Device Flow.

# If the host's sshd uses port 22, move sshd to another port or use another port here.
listen = "0.0.0.0:22"
# The host key, database, and master key are created if missing.
host_key = "/var/lib/chloe/host_key"
database = "/var/lib/chloe/chloe.db"
master_key = "/var/lib/chloe/master.key"
# Audit log (JSON Lines). Records logins, sessions, port forwarding, runners, and secret lookups.
audit_log = "/var/log/chloe/audit.jsonl"
idle_timeout_secs = 1800

# GitHub App configuration (docs/github-app.md). Members of organizations with the app installed can log in.
# github_app = "/etc/chloe/github-app.toml"

# GitHub logins allowed to log in (in addition to members of the GitHub App's organizations).
allowed_users = ["your-github-login"]
# Server operators. They can change any organization's and team's settings (chloe policy) and secrets.
# Organization administrators on GitHub can change their organization's without being listed here.
admins = ["your-github-login"]

# Outbound traffic rules shared by all workspaces, by destination, method, and path. Evaluated top to bottom;
# the first match decides. If none matches, traffic is blocked. See docs/configuration.md for the format.
# Secret injection destinations (api.anthropic.com etc.) not written in any rule
# are added automatically when the secret is registered.
[[policy.rules]]
name = "github-no-delete"
hosts = ["api.github.com"]
methods = ["DELETE"]
paths = ["/repos/**"]
action = "deny"

[[policy.rules]]
name = "default"
hosts = [
    "api.anthropic.com",
    "statsig.anthropic.com",
    "claude.ai",
    "platform.claude.com",
    "api.openai.com",
    "auth.openai.com",
    "chatgpt.com",
    "github.com",
    "api.github.com",
    "*.githubusercontent.com",
    # Tool version lists fetched by mise (most downloads come from github.com).
    "mise-versions.jdx.dev",
    "registry.npmjs.org",
    "pypi.org",
    "files.pythonhosted.org",
    "crates.io",
    "static.crates.io",
    "index.crates.io",
]
action = "allow"

# Destinations relayed without decryption (for clients that pin certificates). Methods and paths cannot be set,
# and the gateway does not start if destinations overlap other rules.
[[policy.rules]]
name = "passthrough"
hosts = [
    "registry-1.docker.io",
    "auth.docker.io",
    "*.docker.com",
    "*.ubuntu.com",
]
action = "passthrough"

# How the GitHub token (github_token) is passed to the VM. If omitted, the github.com default is used.
# Set it e.g. for GitHub Enterprise Server. Format: a secret definition (docs/usage.md) without the value.
# [github_token]
# env = ["GH_TOKEN", "GITHUB_TOKEN"]
# placeholder = "ghu_{id}"
# [[github_token.inject]]
# hosts = ["ghe.example.com"]
# header = "authorization"
# format = "basic-password"           # git over HTTPS (Basic auth password)
# [[github_token.inject]]
# hosts = ["api.ghe.example.com"]
# header = "authorization"

# Default vCPU count and memory (MiB) of workspace VMs. Users can change them with chloe ws machine.
# [machine]
# vcpus = 4
# memory_mib = 4096

# Default and maximum workspace disk sizes (GiB). Users can grow disks up to the maximum with chloe ws disk.
# [disks]
# workspace_gib = 20
# docker_gib = 40
# max_workspace_gib = 200
# max_docker_gib = 400

# Refuse, for ban_secs, sources whose unauthenticated SSH connections (failed or closed without doing anything)
# reach max_failures within window_secs. max_failures = 0 disables this.
# [ban]
# max_failures = 10
# window_secs = 600
# ban_secs = 600
# ignore = ["127.0.0.0/8", "::1", "10.0.0.0/8"]  # monitoring and health-check sources

# Run runners on the same host as systemd units. Paths go in /etc/chloe/runner.env.
# To run them in Docker containers, remove kind and set guest_dir, egress_bin, and state_root
# ([runner] in docs/configuration.md).
[runner]
kind = "systemd"

# To place runners on multiple hosts, write [cluster] instead of [runner].
# sudo -u chloe chloe-gateway --config /etc/chloe/gateway.toml node add <name> --url https://<host>:8445
# creates a join token; then run chloe-node join on that host (deploy/node.toml).
# [cluster]
# listen = "0.0.0.0:8444"            # internal API (mTLS) chloe-node connects to
# server_names = ["cp.example.com"]  # name chloe-node connects to (put in the certificate)
# pki_dir = "/var/lib/chloe/pki"     # CA certificate and key

# HTTP(S) admin API and web UI. Pass a token from chloe token create to the admin API as a Bearer token.
# HTTPS if tls_cert and tls_key are set, otherwise HTTP (behind a reverse proxy or for local use).
# Setting public_url serves the web UI (the URL opened in a browser; the reverse proxy's URL if you use one).
# [api]
# listen = "127.0.0.1:8080"
# tls_cert = "/etc/chloe/api.crt"
# tls_key = "/etc/chloe/api.key"
# public_url = "https://chloe.example.com"
# web_root = "/usr/local/share/chloe/web"
# Base for hosts that open ports published in the VM. Random <name>.<domain> hosts are assigned,
# so wildcard DNS and a certificate are needed. Prefer a different registrable domain from the web UI.
# proxy_url = "https://chloe-preview.example.net"
