# Example chloe-node configuration (/etc/chloe/node.toml). Paths match the layout in docs/install.md.
#
# 1. On the control plane: sudo -u chloe chloe-gateway --config /etc/chloe/gateway.toml node add n1 --url https://<this-host>:8445
# 2. On this host:         sudo -u chloe chloe-node join --server https://<control-plane>:8444 --token <token> --dir /var/lib/chloe-node/tls
# 3. On this host:         sudo systemctl enable --now chloe-node

# Listen address of the API (mTLS) the control plane connects to. Use the same port as the node add URL.
listen = "0.0.0.0:8445"
# Certificate and key received from join.
credentials = "/var/lib/chloe-node/tls"
# Where real-value lookups are relayed (the control plane's internal API).
control_plane = "https://cp.example.com:8444"

# Run runners as systemd units. Paths go in /etc/chloe/runner.env.
# To run them in Docker containers, remove kind and set guest_dir, egress_bin, and state_root
# ([runner] in docs/configuration.md).
[runner]
kind = "systemd"
