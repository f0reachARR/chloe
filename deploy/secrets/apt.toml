# Password for an authenticated apt repository. apt does not read environment variables, so the placeholder
# is written to auth.conf in the VM. apt sends it as the Basic auth password, and the proxy replaces it
# with the real value.
# Adjust hosts and the file's machine and login to your repository, replace value with the real password, and register it.
#   ssh USER@HOST chloe secret set apt --spec < apt.toml
# Use https:// for the repository in sources.list (with http://, the real password goes out from the proxy in plaintext).
value = "..."

[[inject]]
hosts = ["apt.example.com"]
header = "authorization"
format = "basic-password"

[[files]]
path = "/etc/apt/auth.conf.d/chloe-apt.conf"
content = "machine apt.example.com login deploy password {value}\n"
