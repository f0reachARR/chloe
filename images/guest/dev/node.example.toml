# chloe-node の設定の例 (段階 9)。
#
# 1. コントロールプレーンで: chloe-gateway --config gateway.toml node add n1 --url https://<このホスト>:8445
# 2. このホストで:         chloe-node join --server https://<コントロールプレーン>:8444 --token <トークン> --dir /var/lib/chloe-node/tls
# 3. このホストで:         chloe-node run --config node.toml

# コントロールプレーンからの API (相互 TLS) の待ち受け。node add の URL と同じポートにする。
listen = "0.0.0.0:8445"
# join で受け取った証明書と鍵。
credentials = "/var/lib/chloe-node/tls"
# 本物の値の問い合わせを中継する先 (コントロールプレーンの内部 API)。
control_plane = "https://cp.example.com:8444"

[runner]
guest_dir = "/opt/chloe/guest"
egress_bin = "/opt/chloe/bin/chloe-egress"
state_root = "/var/lib/chloe-node/workspaces"
