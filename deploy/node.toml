# chloe-node の設定の例 (/etc/chloe/node.toml)。配置は docs/install.md の「配置」に合わせてある。
#
# 1. コントロールプレーンで: sudo -u chloe chloe-gateway --config /etc/chloe/gateway.toml node add n1 --url https://<このホスト>:8445
# 2. このホストで:         sudo -u chloe chloe-node join --server https://<コントロールプレーン>:8444 --token <トークン> --dir /var/lib/chloe-node/tls
# 3. このホストで:         sudo systemctl enable --now chloe-node

# コントロールプレーンからの API (相互 TLS) の待ち受け。node add の URL と同じポートにする。
listen = "0.0.0.0:8445"
# join で受け取った証明書と鍵。
credentials = "/var/lib/chloe-node/tls"
# 本物の値の問い合わせを中継する先 (コントロールプレーンの内部 API)。
control_plane = "https://cp.example.com:8444"

[runner]
guest_dir = "/usr/local/lib/chloe/guest"
egress_bin = "/usr/local/lib/chloe/chloe-egress"
state_root = "/var/lib/chloe-node/workspaces"
