# Example gateway configuration for development. Start it from the repository root as follows.
# For an example of deploying on a host, see deploy/gateway.toml.
#
#   images/guest/kernel/build.sh && images/guest/rootfs/build.sh
#   docker build -t chloe-dev-runner -f images/guest/dev/runner.Dockerfile images/guest
#   cargo build -p chloe-egress -p chloe-gateway
#   target/debug/chloe-gateway --config images/guest/dev/gateway.example.toml
#
# Connect with ssh -p 2222 <github-login>@127.0.0.1, using a public key registered on GitHub.
# With a GitHub App configured, users without a registered public key can log in via Device Flow.

listen = "127.0.0.1:2222"
host_key = "build/dev/gateway/host_key"
database = "build/dev/gateway/chloe.db"
master_key = "build/dev/gateway/master.key"
# Audit log (JSON Lines). Records logins, sessions, port forwarding, runners, and secret lookups.
audit_log = "build/dev/gateway/audit.jsonl"
idle_timeout_secs = 1800

# GitHub App configuration (docs/github-app.md). Members of organizations with the app installed can log in.
# github_app = "~/.config/chloe/github-app.toml"

# GitHub logins allowed to log in (in addition to members of the GitHub App's organizations).
allowed_users = ["your-github-login"]
# Server operators. They can change any organization's and team's settings (chloe policy), workspace rules, and secrets.
# Organization administrators on GitHub can change their organization's without being listed here.
admins = ["your-github-login"]

# Users who may enter team and organization workspaces (a stopgap until GitHub App checks are in place).
[memberships]
# "org:your-org" = ["your-github-login"]
# "team:your-org/your-team" = ["your-github-login"]

[policy]
# Let users add rules to their own personal workspaces (chloe policy set,
# chloe ws policy set). Only destinations not in the rules below can be added.
# allow_personal_rules = true

# Outbound traffic rules shared by all workspaces, by destination, method, and path. Evaluated top to bottom;
# the first match decides. If none matches, traffic is blocked. In paths, * matches within one segment,
# ** matches zero or more segments, and matching is case-insensitive.
# Secret injection destinations (api.anthropic.com etc.) not written in any rule
# are added automatically when the secret is registered.
[[policy.rules]]
name = "github-no-delete"
hosts = ["api.github.com"]
methods = ["DELETE"]
paths = ["/repos/**"]
action = "deny"

# To restrict api.github.com to your organization's repositories, put these before default below
# (requests to api.github.com that don't match would be allowed by default, so add a deny too).
# [[policy.rules]]
# name = "github-org-only"
# hosts = ["api.github.com"]
# paths = ["/repos/your-org/**", "/user", "/user/**", "/graphql", "/rate_limit"]
# action = "allow"
#
# [[policy.rules]]
# name = "github-default-deny"
# hosts = ["api.github.com"]
# action = "deny"

# Deny git push (clone and fetch still work).
# [[policy.rules]]
# name = "no-push"
# hosts = ["github.com"]
# methods = ["POST"]
# paths = ["/*/*/git-receive-pack", "/*/*.git/git-receive-pack"]
# action = "deny"

[[policy.rules]]
name = "default"
hosts = [
    "api.anthropic.com",
    "statsig.anthropic.com",
    "claude.ai",
    "platform.claude.com",
    "api.openai.com",
    "auth.openai.com",
    "chatgpt.com",
    "github.com",
    "api.github.com",
    "*.githubusercontent.com",
    # Tool version lists fetched by mise (most downloads come from github.com).
    "mise-versions.jdx.dev",
    "registry.npmjs.org",
    "pypi.org",
    "files.pythonhosted.org",
    "crates.io",
    "static.crates.io",
    "index.crates.io",
]
action = "allow"

# Destinations relayed without decryption (for clients that pin certificates). Methods and paths cannot be set,
# and the gateway does not start if destinations overlap other rules.
[[policy.rules]]
name = "passthrough"
hosts = [
    "registry-1.docker.io",
    "auth.docker.io",
    "*.docker.com",
    "*.ubuntu.com",
]
action = "passthrough"

[runner]
guest_dir = "build/guest"
egress_bin = "target/debug/chloe-egress"
state_root = "build/dev/gateway/workspaces"

# To place runners on multiple hosts, write [cluster] instead of [runner] (stage 9).
# chloe-gateway --config <this> node add <name> --url https://<host>:<port> creates a join
# token; then run chloe-node join on that host (deploy/node.toml).
# [cluster]
# listen = "0.0.0.0:8444"            # internal API (mTLS) chloe-node connects to
# server_names = ["cp.example.com"]  # name chloe-node connects to (put in the certificate)
# pki_dir = "build/dev/gateway/pki"  # CA certificate and key

# HTTP(S) admin API. Pass a token from chloe token create as a Bearer token.
# HTTPS if tls_cert and tls_key are set, otherwise HTTP (behind a reverse proxy or for local use).
# [api]
# listen = "127.0.0.1:8080"
# tls_cert = "/etc/chloe/api.crt"
# tls_key = "/etc/chloe/api.key"
