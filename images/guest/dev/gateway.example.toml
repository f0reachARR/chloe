# 開発用のゲートウェイの設定の例。リポジトリのルートで次のように起動する。
#
#   images/guest/kernel/build.sh && images/guest/rootfs/build.sh
#   docker build -t chloe-dev-runner -f images/guest/dev/runner.Dockerfile images/guest/dev
#   cargo build -p chloe-egress -p chloe-gateway
#   target/debug/chloe-gateway --config images/guest/dev/gateway.example.toml
#
# 接続は ssh -p 2222 <GitHub のログイン名>@127.0.0.1 。公開鍵は GitHub に登録したものを使う。
# GitHub App を設定すると、公開鍵を登録していない利用者は Device Flow でログインできる。

listen = "127.0.0.1:2222"
host_key = "build/dev/gateway/host_key"
database = "build/dev/gateway/chloe.db"
master_key = "build/dev/gateway/master.key"
# 監査ログ (JSON Lines)。ログイン、セッション、ポート転送、ランナー、シークレットの問い合わせを記録する。
audit_log = "build/dev/gateway/audit.jsonl"
idle_timeout_secs = 1800

# GitHub App の設定 (docs/github-app.md)。アプリをインストールした Organization のメンバーがログインできる。
# github_app = "~/.config/chloe/github-app.toml"

# ログインを許す GitHub のログイン名 (GitHub App の Organization のメンバーに加えて許す)。
allowed_users = ["your-github-login"]
# サーバーの運用者。どの Organization と team の設定 (chloe policy) とシークレットも変えられる。
# GitHub で Organization の管理者である利用者は、ここに書かなくてもその Organization のものを変えられる。
admins = ["your-github-login"]

# team と Organization のワークスペースに入れる利用者 (GitHub App による確認を入れるまでの仮のもの)。
[memberships]
# "org:your-org" = ["your-github-login"]
# "team:your-org/your-team" = ["your-github-login"]

# すべてのワークスペースに共通の許可リスト。シークレットの差し替え先 (api.anthropic.com など) は
# シークレットを登録すると自動で加わる。
[policy]
allow = [
    "api.anthropic.com",
    "statsig.anthropic.com",
    "claude.ai",
    "platform.claude.com",
    "api.openai.com",
    "auth.openai.com",
    "chatgpt.com",
    "github.com",
    "api.github.com",
    "*.githubusercontent.com",
    "registry.npmjs.org",
    "pypi.org",
    "files.pythonhosted.org",
    "crates.io",
    "static.crates.io",
    "index.crates.io",
]
passthrough = [
    "registry-1.docker.io",
    "auth.docker.io",
    "*.docker.com",
    "*.ubuntu.com",
]

# 宛先、メソッド、パスの規則。上から順に評価し、最初に一致した規則で決める。
# どれにも一致しなければ許可リストだけで判定する。パスの * は一つの階層の中、** は 0 個以上の
# 階層に一致し、大文字と小文字は区別しない。中継のみ (passthrough) の宛先には効かない。
[[policy.rules]]
name = "github-no-delete"
hosts = ["api.github.com"]
methods = ["DELETE"]
paths = ["/repos/**"]
action = "deny"

# [[policy.rules]]
# name = "github-org-only"
# hosts = ["api.github.com"]
# paths = ["/repos/your-org/**", "/user", "/user/**", "/graphql", "/rate_limit"]
# action = "allow"
#
# [[policy.rules]]
# name = "github-default-deny"
# hosts = ["api.github.com"]
# action = "deny"

# git の push を拒否する (clone と fetch は通す)。
# [[policy.rules]]
# name = "no-push"
# hosts = ["github.com"]
# methods = ["POST"]
# paths = ["/*/*/git-receive-pack", "/*/*.git/git-receive-pack"]
# action = "deny"

[runner]
guest_dir = "build/guest"
egress_bin = "target/debug/chloe-egress"
state_root = "build/dev/gateway/workspaces"

# 複数のホストにランナーを置くときは、[runner] の代わりに [cluster] を書く (段階 9)。
# chloe-gateway --config <this> node add <名前> --url https://<host>:<port> で参加用の
# トークンを作り、そのホストで chloe-node join を実行する (node.example.toml)。
# [cluster]
# listen = "0.0.0.0:8444"            # chloe-node から受ける内部 API (相互 TLS)
# server_names = ["cp.example.com"]  # chloe-node がつなぐ名前 (証明書に入れる)
# pki_dir = "build/dev/gateway/pki"  # CA の証明書と鍵

# HTTP(S) の管理 API。chloe token create で作ったトークンを Bearer で渡す。
# tls_cert と tls_key を書けば HTTPS、なければ HTTP (リバースプロキシの後ろかローカル向け)。
# [api]
# listen = "127.0.0.1:8080"
# tls_cert = "/etc/chloe/api.crt"
# tls_key = "/etc/chloe/api.key"
